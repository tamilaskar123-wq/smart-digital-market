<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART DIGITAL MARKET - Customer Order</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f3f6fa;color:#172033;font-family:Arial,sans-serif}
main{max-width:520px;margin:20px auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 14px #10204012}
h1{font-size:22px;margin:0 0 6px}.sub,.hint{color:#687386;font-size:14px}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:8px;font:inherit;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#16834a;color:white;font-size:16px;font-weight:bold}
.hint{font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>SMART DIGITAL MARKET</h1>
<p class="sub">Customer Order Form — অর্ডার করতে তথ্য লিখুন</p>
<form id="orderForm">
<label for="customerName">Customer Name / কাস্টমারের নাম</label>
<input id="customerName" type="text" maxlength="80" autocomplete="name" placeholder="আপনার নাম লিখুন" required>
<label for="mobile">Mobile Number / মোবাইল নম্বর</label>
<input id="mobile" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" autocomplete="tel" placeholder="১০ সংখ্যার মোবাইল নম্বর" required>
<label for="address">Full Address / সম্পূর্ণ ঠিকানা</label>
<textarea id="address" maxlength="500" autocomplete="street-address" placeholder="গ্রাম, পোস্ট অফিস, জেলা, PIN লিখুন" required></textarea>
<label for="orderDetails">Order Details / কী কী পণ্য লাগবে?</label>
<textarea id="orderDetails" maxlength="1000" placeholder="পণ্যের নাম ও পরিমাণ লিখুন" required></textarea>
<button type="submit">Send Order on WhatsApp</button>
<p class="hint">তথ্য WhatsApp-এ অর্ডার নম্বরে পাঠানোর জন্য প্রস্তুত হবে। পাঠানোর আগে WhatsApp-এ তথ্য দেখে নিন।</p>
</form>
</main>
<script>
const STORE_WHATSAPP = "917635844878";
document.getElementById("orderForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const name = document.getElementById("customerName").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const address = document.getElementById("address").value.trim();
  const details = document.getElementById("orderDetails").value.trim();
  if (!name || !address || !details || !/^[6-9][0-9]{9}$/.test(mobile)) {
    alert("সব তথ্য ঠিকভাবে পূরণ করুন। মোবাইল নম্বর ১০ সংখ্যার হতে হবে।");
    return;
  }
  const message = "SMART DIGITAL MARKET - New Customer Order\n\n" +
    "Customer Name: " + name + "\nMobile Number: " + mobile +
    "\nAddress: " + address + "\nOrder Details: " + details;
  window.open("https://wa.me/" + STORE_WHATSAPP + "?text=" + encodeURIComponent(message), "_blank", "noopener,noreferrer");
});
</script>
</body>
</html>
